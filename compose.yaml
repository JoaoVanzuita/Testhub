services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testhub}
      POSTGRES_USER: ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testhub-local-only}
    volumes:
      # PostgreSQL 18 stores data in a major-version subdirectory, so the
      # single supported mount point is the parent directory.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testhub} -d ${POSTGRES_DB:-testhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Compose network the database is reached by service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    command: python manage.py runserver 0.0.0.0:8000

  # Durable AI worker: a second process of the same image and database.
  # It polls pending reports, calls the provider-neutral adapter outside any
  # transaction and updates only AI fields; no extra service is introduced.
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py process_ai_reports

volumes:
  # Named volume keeps PostgreSQL data across `docker compose down`.
  postgres_data:
